spring:
  datasource:
    url: jdbc:posgresql://localhost:5432/student_tracking
    username: postgres
    password: YOUR_PASSWORD
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  application:
    name: student-tracking

server:
  port: 8080
